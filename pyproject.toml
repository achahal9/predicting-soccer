[project]
name = "my-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0,<3.0.0",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "soccerdata>=1.8.7",
]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "pytest>=8.3.5",
    "ruff>=0.15.0",
    "ty>=0.0.16",
]

[tool.pytest.ini_options]
markers = [
    "network: tests that require internet access (deselect with '-m not network')",
]
